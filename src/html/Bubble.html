<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bolha Radar</title>
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';
    " />
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/all.min.css" />
    <link rel="stylesheet" href="css/Bubble_Style.css" />
  </head>
  <body>
    <div id="bubble" title="Mostrar Radar">
      <i id="bubble-icon" class="fa-solid fa-plane-up"></i>
    </div>
    <script>
      const api = window.api;
      const bubble = document.getElementById("bubble");
      const icon   = document.getElementById("bubble-icon");

      api.invoke("get-config").then(config => {
        const size = config.bubble?.size || 60;
        bubble.style.width  = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.background = config.bubble?.color || "#1982d2";
        icon.style.color = config.bubble?.iconColor || "#ffffff";
      });

      let dragging = false, offsetX = 0, offsetY = 0;

      bubble.addEventListener("mousedown", e => {
        dragging = true; offsetX = e.clientX; offsetY = e.clientY;
        document.body.style.cursor = "grabbing";
      });
      document.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        document.body.style.cursor = "";
        api.send("save-bubble-position");
      });
      document.addEventListener("mousemove", e => {
        if (!dragging) return;
        api.send("move-bubble", {
          x: window.screenX + (e.clientX - offsetX),
          y: window.screenY + (e.clientY - offsetY)
        });
      });
      bubble.addEventListener("dblclick", () => api.send("restore-from-bubble"));
    </script>
  </body>
</html>
