<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https://*.tile.openstreetmap.org;
    font-src 'self';
    media-src 'self' file:;
    connect-src https://api.open-meteo.com;
  " />
  <title>Radar Aéreo Widget</title>
  <link rel="stylesheet" href="../../assets/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="../../assets/vendor/fontawesome/all.min.css" />
  <link rel="stylesheet" href="css/Style.css" />
</head>
<body>
  <div id="container">
    <div id="dragbar">
      ⠿ Radar Aéreo
      <div id="window-btns">
        <button class="window-btn" id="settingsbtn" title="Configurações">
          <i class="fa-solid fa-gear"></i>
        </button>
        <button class="window-btn" id="minbtn" title="Minimizar">—</button>
        <button class="window-btn" id="closebtn" title="Fechar">✕</button>
      </div>
    </div>

    <div id="weather">
      <i class="fa-solid fa-cloud-sun"></i> Carregando clima...
    </div>

    <div id="setloc-container">
      <button id="setloc-btn" title="Definir localização manual">Alterar Localização</button>
    </div>

    <div id="map-wrapper">
      <div id="map"></div>
      <div id="zoom-controls">
        <button id="zoomin" title="Zoom In">+</button>
        <button id="zoomout" title="Zoom Out">−</button>
      </div>
    </div>

    <div id="list"><b>Aviões mais próximos:</b></div>
    <audio id="notifysound" preload="auto"></audio>
  </div>

  <script src="../../assets/vendor/leaflet/leaflet.js"></script>
  <script src="../js/Widget.js"></script>
</body>
</html>
